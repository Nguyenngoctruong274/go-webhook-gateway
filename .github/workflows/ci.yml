name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: webhooks
          POSTGRES_PASSWORD: webhooks
          POSTGRES_DB: webhooks_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U webhooks"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      WH_TEST_DATABASE_URL: postgres://webhooks:webhooks@localhost:5432/webhooks_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test (unit + PostgreSQL)
        run: go test -race -coverpkg=./internal/... -coverprofile=coverage.out ./...
      - name: Coverage
        run: go tool cover -func=coverage.out | tail -1
      - name: Fuzz (short)
        run: |
          go test -run '^$' -fuzz FuzzDeliveryInvariants -fuzztime 20s ./internal/event
          go test -run '^$' -fuzz FuzzVerify -fuzztime 15s ./internal/signing
          go test -run '^$' -fuzz FuzzBreakerInvariants -fuzztime 15s ./internal/breaker
      - name: Benchmarks (smoke)
        # Keeps the benchmarks compiling and running; the numbers in the
        # README come from longer runs, not from shared CI runners.
        run: go test -run '^$' -bench . -benchtime 50x ./...

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Built with go install through the module proxy: the action's
      # default path asks the GitHub releases API for the binary, and that
      # API has been answering 504 to it.
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          install-mode: goinstall

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Validate compose file
        run: docker compose --profile stack config -q
      - name: Build image
        run: docker build -t go-webhook-gateway:ci .
      - name: Smoke test the stack
        run: |
          docker compose --profile stack up -d --build
          for i in $(seq 1 30); do
            curl -fsS localhost:8080/readyz && exit 0
            sleep 2
          done
          docker compose --profile stack logs
          exit 1
      - name: Tear down
        if: always()
        run: docker compose --profile stack down -v
