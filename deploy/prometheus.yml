# Scrape config for the compose stack. /metrics is served next to the
# probes without the API token: keep it on an internal network. A short
# interval suits the demo; 15-30s is plenty in production.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: webhookd
    static_configs:
      - targets: ["webhookd:8080"]
