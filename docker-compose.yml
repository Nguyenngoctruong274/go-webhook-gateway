# `docker compose up -d` starts only PostgreSQL, for local development and
# tests. `docker compose --profile stack up --build` also runs webhookd.
# Credentials here are for local use only.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: webhooks
      POSTGRES_PASSWORD: webhooks
      POSTGRES_DB: webhooks
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhooks -d webhooks"]
      interval: 2s
      timeout: 2s
      retries: 15

  webhookd:
    profiles: ["stack"]
    build: .
    environment:
      WH_DATABASE_URL: postgres://webhooks:webhooks@postgres:5432/webhooks?sslmode=disable
      WH_LOG_LEVEL: info
      WH_SHUTDOWN_DRAIN: 2s
      # A receiver run on the host or on the Docker network has a private
      # address, which the egress guard refuses by default. Never set
      # this in production.
      WH_EGRESS_ALLOW: 172.16.0.0/12,10.0.0.0/8,192.168.0.0/16
    ports:
      - "8080:8080"
    stop_grace_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
